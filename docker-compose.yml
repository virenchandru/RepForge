services:
  postgres:
    image: postgres:17
    container_name: repforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: repforge
      POSTGRES_USER: repforge
      POSTGRES_PASSWORD: repforge
    ports:
      - "5432:5432"
    volumes:
      - repforge_postgres_data:/var/lib/postgresql/data

volumes:
  repforge_postgres_data: